<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b3d2e">
<title>Registro Bloque Administrativo · Uniguajira</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#0c1411;--card:#14201b;--card2:#1c2d26;--card3:#243a31;--txt:#e9f3ee;--mut:#8fa69b;--pri:#1fb978;--pri2:#15915d;--warn:#f0b429;--bad:#e5484d;--blue:#3b82f6;--purple:#a855f7;--bd:#263830}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:84px;user-select:none}
header{position:sticky;top:0;z-index:20;background:#09251c;border-bottom:1px solid var(--bd);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hdr-main{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.bloque-chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--bd);border-radius:20px;padding:4px 10px;font-size:13px;font-weight:700;color:var(--pri);max-width:100%;cursor:pointer}
.bloque-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#clock{font:700 20px ui-monospace,Consolas,monospace;color:#a3e6cb}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#091511;border-top:1px solid var(--bd);z-index:30}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 2px 10px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:18px}
nav button.on{color:var(--pri);font-weight:700}
main{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
label{display:block;font-size:12px;color:var(--mut);margin:6px 0 3px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--bd);color:var(--txt);border-radius:8px;padding:9px;font-size:14px;user-select:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 12px}
.btn{background:var(--card2);color:var(--txt);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;font-size:13px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#03140c}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#241a00}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sm{padding:5px 8px;font-size:11px;border-radius:7px}
.btn:active{transform:scale(.97)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* BOTONES GIGANTES DE ENTRADA */
.tap-zone{display:grid;grid-template-columns:1fr;gap:10px;margin:10px 0}
.btn-entry{width:100%;padding:26px 12px;font-size:24px;font-weight:800;border-radius:16px;background:linear-gradient(180deg,#2ad38d,#15935d);border:0;color:#02140a;cursor:pointer;box-shadow:0 6px 18px #1fb97844;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.btn-entry:active{transform:scale(.98);filter:brightness(1.1)}
.btn-entry span{font-size:12px;font-weight:600;opacity:.85;letter-spacing:.3px}

/* TARJETAS DE PERSONAS ADENTRO */
.p-card{background:var(--card2);border:1px solid var(--bd);border-left:4px solid var(--pri);border-radius:12px;padding:10px;margin-bottom:8px}
.p-card.atencion{border-left-color:var(--blue)}
.p-card.cola{border-left-color:var(--warn)}
.p-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:6px}
.p-id{font-weight:800;font-size:15px;color:var(--txt)}
.p-time{font:12px ui-monospace,Consolas,monospace;color:#a7c4b7}
.p-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.p-tag-input{background:none;border:0;border-bottom:1px dashed var(--bd);color:#cbdad2;font-size:12px;padding:2px 4px;width:130px}
.p-tag-input:focus{outline:0;border-bottom-color:var(--pri)}

.badge{display:inline-block;padding:2px 7px;border-radius:99px;font-size:11px;font-weight:700}
.badge.ok{background:#1fb97825;color:#4ade80}
.badge.warn{background:#f0b42925;color:#fbbf24}
.badge.blue{background:#3b82f625;color:#60a5fa}
.badge.bad{background:#e5484d25;color:#f87171}

.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.stat-box{background:var(--card2);border-radius:10px;padding:8px 4px;text-align:center}
.stat-box b{display:block;font-size:20px;color:var(--txt)}
.stat-box span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px}

.alert{background:var(--warn);color:#241a00;padding:10px 12px;border-radius:10px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.2)}}

table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid var(--bd);padding:6px 4px;text-align:center}
th{color:var(--mut);font-weight:600;background:var(--card)}
.tbl{overflow:auto;max-height:50vh}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#000000dd;border:1px solid #ffffff22;color:#fff;padding:8px 16px;border-radius:99px;font-size:13px;z-index:99;pointer-events:none}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;height:42px;font-size:22px;border-radius:10px}
.step b{min-width:36px;text-align:center;font-size:22px}
.muted{color:var(--mut);font-size:12px}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-body{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;width:100%;max-width:400px}
</style>
</head>
<body>
<header>
  <div class="hdr-main">
    <div class="bloque-chip" onclick="abrirCambioBloque()" title="Cambiar bloque">
      🏢 <span id="hBloque">Bloque Administrativo A</span> ✏️
    </div>
  </div>
  <div id="clock">--:--:--</div>
</header>

<main id="app"></main>

<nav>
  <button data-t="registro" class="on"><b>⏱️</b>Registro</button>
  <button data-t="cortes"><b>📸</b>Cortes</button>
  <button data-t="resumen"><b>📊</b>Métricas</button>
  <button data-t="datos"><b>💾</b>Exportar</button>
  <button data-t="bloque"><b>⚙️</b>Bloque</button>
</nav>

<div id="modalSlot"></div>

<script>
/* ================== CONFIGURACIÓN INICIAL ================== */
const KEY = 'regBloques_v2';
const defCfg = {
  bloque: 'Bloque Administrativo A',
  zona: 'Zona 1',
  est1: 'Balmes',
  est2: '',
  punto: 'Puerta principal / Ventanilla',
  horario: 'Hora pico',
  c: 1,
  iguales: 'Sí',
  accesos: '1 acceso principal',
  disciplina: 'FIFO',
  fila: 'Una sola fila',
  capEspera: '20',
  turnos: 'Jornada continua',
  abandono: 'No',
  abandonoHora: '0',
  aforo: '50',
  seguirCada: 1,
  unity: {}
};

let S = JSON.parse(localStorage.getItem(KEY) || 'null');
if(!S){
  const old = localStorage.getItem('regBloques_v1');
  if(old){
    try{ S = JSON.parse(old); }catch(e){}
  }
}
if(!S){
  S = { cfg: {...defCfg}, sessions: [], cur: null };
}
S.cfg = { ...defCfg, ...S.cfg };

// Sesión automática inmediata si no hay ninguna
const dNow = new Date();
const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
if(!S.sessions || S.sessions.length === 0){
  const s0 = {
    id: Date.now(),
    num: 1,
    fecha: dNow.toISOString().slice(0,10),
    dia: dias[dNow.getDay()],
    inicio: '',
    fin: '',
    people: [],
    cortes: [],
    clima: 'Normal',
    anormal: '',
    franja: 'Hora pico'
  };
  S.sessions = [s0];
  S.cur = s0.id;
} else if(!S.cur){
  S.cur = S.sessions[0].id;
}

let tab = 'registro'; // SIEMPRE arranca directo a registrar

const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const cur = () => S.sessions.find(s => s.id === S.cur) || S.sessions[0];
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const nowT = () => {
  const d = new Date();
  return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
};
const toS = t => {
  if(!t || !/^\d{1,2}:\d{2}(:\d{2})?$/.test(t)) return null;
  const p = t.split(':').map(Number);
  return p[0]*3600 + p[1]*60 + (p[2]||0);
};
const fromS = s => {
  s = ((s%86400)+86400)%86400;
  return pad(Math.floor(s/3600)) + ':' + pad(Math.floor(s%3600/60)) + ':' + pad(Math.floor(s%60));
};
const dur = s => s == null || isNaN(s) ? '—' : (s < 0 ? '-' : '') + Math.floor(Math.abs(s)/60) + 'm ' + pad(Math.round(Math.abs(s)%60)) + 's';
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const sd = a => {
  if(a.length < 2) return null;
  const m = avg(a);
  return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1));
};
const r2 = x => x == null || isNaN(x) ? '' : Math.round(x*100)/100;
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(m){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = m;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 1400);
}
function beep(f=880, d=.12){
  try{
    const a = new (window.AudioContext||window.webkitAudioContext)();
    const o = a.createOscillator(), g = a.createGain();
    o.frequency.value = f;
    o.connect(g);
    g.connect(a.destination);
    g.gain.value = .18;
    o.start();
    o.stop(a.currentTime+d);
  }catch(e){}
}
function vib(p=35){ if(navigator.vibrate) navigator.vibrate(p); }

/* ================== CÁLCULOS ================== */
function calcSession(s){
  if(!s) return {};
  const c = +S.cfg.c || 1;
  const P = s.people || [];
  const arr = P.filter(p=>p.obs!=='PE' && toS(p.A)!=null).map(p=>toS(p.A)).sort((a,b)=>a-b);
  const inter = [];
  for(let i=1; i<arr.length; i++) inter.push(arr[i]-arr[i-1]);

  const comp = P.filter(p => toS(p.A)!=null && toS(p.D)!=null);
  const w = comp.map(p => toS(p.D) - toS(p.A));
  
  const conAtencion = P.filter(p => toS(p.A)!=null && toS(p.B)!=null && toS(p.C)!=null);
  const wq = conAtencion.map(p => toS(p.B) - toS(p.A));
  const ws = conAtencion.map(p => toS(p.C) - toS(p.B));

  const ini = toS(s.inicio) ?? (arr.length ? arr[0] : null);
  const fin = toS(s.fin) ?? (toS(nowT()));
  const durMin = ini!=null && fin!=null ? Math.max(1, (fin-ini)/60) : null;

  const colas = (s.cortes||[]).map(k=>+k.cola).filter(x=>!isNaN(x));
  const ocup = (s.cortes||[]).map(k=>+k.ocup).filter(x=>!isNaN(x));

  const adentro = P.filter(p => p.A && !p.D && p.obs !== 'AB' && p.obs !== 'PE').length;

  return {
    total: P.length,
    validas: arr.length,
    comp: comp.length,
    adentro,
    pe: P.filter(p=>p.obs==='PE').length,
    ab: P.filter(p=>p.obs==='AB').length,
    pr: P.filter(p=>p.obs==='PR').length,
    durMin,
    lambda: durMin ? arr.length/durMin : null,
    inter: avg(inter),
    interSd: sd(inter),
    wq: avg(wq),
    ws: avg(ws),
    w: avg(w),
    wSd: sd(w),
    colaProm: avg(colas),
    colaMax: colas.length ? Math.max(...colas) : null,
    util: ocup.length ? avg(ocup)/c : null,
    cortes: (s.cortes||[]).length
  };
}

/* ================== ACCIONES ULTRA RÁPIDAS ================== */
function entradaRapida(tag=''){
  const s = cur();
  if(!s.inicio) s.inicio = nowT();
  const n = s.people.length + 1;
  s.people.push({
    n,
    nombre: tag,
    A: nowT(),
    B: '',
    C: '',
    D: '',
    serv: '1',
    obs: '',
    seg: true
  });
  save();
  vib(40);
  beep(1100, .06);
  toast(`Entrada #${n} registrada`);
  render();
}

function marcarSalida(n){
  const s = cur();
  const p = s.people.find(x => x.n === n);
  if(!p) return;
  p.D = nowT();
  if(p.B && !p.C) p.C = p.D;
  save();
  vib(50);
  beep(750, .09);
  const estancia = toS(p.D) - toS(p.A);
  toast(`Salida #${n} · Duró ${dur(estancia)}`);
  render();
}

function marcarPaso(n, paso){
  const s = cur();
  const p = s.people.find(x => x.n === n);
  if(!p) return;
  p[paso] = nowT();
  if(paso === 'D' && p.B && !p.C) p.C = p.D;
  save();
  vib(35);
  render();
}

function setPersonaTag(n, val){
  const s = cur();
  const p = s.people.find(x => x.n === n);
  if(p){ p.nombre = val; save(); }
}

function setObsPersona(n, obs){
  const s = cur();
  const p = s.people.find(x => x.n === n);
  if(!p) return;
  p.obs = p.obs === obs ? '' : obs;
  if(obs === 'AB' && !p.D) p.D = nowT();
  save();
  render();
}

function deshacerUltima(){
  const s = cur();
  if(!s.people.length) return;
  if(!confirm(`¿Eliminar la última llegada (#${s.people.length})?`)) return;
  s.people.pop();
  save();
  toast('Última llegada eliminada');
  render();
}

function nuevaSesion(){
  const n = S.sessions.length + 1;
  const d = new Date();
  const s = {
    id: Date.now(),
    num: n,
    fecha: d.toISOString().slice(0,10),
    dia: dias[d.getDay()],
    inicio: '',
    fin: '',
    people: [],
    cortes: [],
    clima: 'Normal',
    anormal: '',
    franja: 'Hora pico'
  };
  S.sessions.push(s);
  S.cur = s.id;
  save();
  toast(`Sesión ${n} iniciada`);
  render();
}

function corteAuto(){
  const s = cur();
  const h = nowT();
  const prev = s.cortes.length ? toS(s.cortes[s.cortes.length-1].hora) : toS(s.inicio);
  const hs = toS(h);
  const lleg = s.people.filter(p => {
    const a = toS(p.A);
    return a != null && (prev==null || a > prev) && a <= hs;
  }).length;
  const c = +S.cfg.c || 1;
  const adentro = s.people.filter(p => p.A && !p.D).length;
  s.cortes.push({
    n: s.cortes.length + 1,
    hora: h,
    llegadas: lleg,
    cola: Math.max(0, adentro - c),
    ocup: Math.min(adentro, c),
    libres: Math.max(0, c - adentro)
  });
  save();
  beep(600, .25);
  toast(`Corte ${s.cortes.length} registrado`);
  render();
}

/* ================== MODAL DE CAMBIO RÁPIDO DE BLOQUE ================== */
function abrirCambioBloque(){
  const comunes = [
    'Bloque Administrativo A',
    'Bloque Administrativo B',
    'Bloque A',
    'Bloque B',
    'Bloque C',
    'Biblioteca',
    'Cafetería Central',
    'Admisiones'
  ];
  $('#modalSlot').innerHTML = `
    <div class="modal" onclick="if(event.target===this)cerrarModal()">
      <div class="modal-body">
        <h2 style="margin-top:0">🏢 Cambiar Bloque</h2>
        <label>Escribe o selecciona el bloque donde estás:</label>
        <input id="inBloqueRapido" value="${esc(S.cfg.bloque)}" placeholder="Ej: Bloque Administrativo A" style="margin-bottom:10px;font-size:16px;font-weight:700">
        <div class="row" style="margin-bottom:14px">
          ${comunes.map(b => `<button class="btn sm" onclick="$('#inBloqueRapido').value='${b}'">${b}</button>`).join('')}
        </div>
        <div class="row" style="justify-content:flex-end">
          <button class="btn" onclick="cerrarModal()">Cancelar</button>
          <button class="btn pri" onclick="guardarBloqueRapido()">Guardar</button>
        </div>
      </div>
    </div>`;
  setTimeout(()=>$('#inBloqueRapido').focus(), 50);
}
function cerrarModal(){ $('#modalSlot').innerHTML = ''; }
function guardarBloqueRapido(){
  const val = $('#inBloqueRapido').value.trim();
  if(val){
    S.cfg.bloque = val;
    save();
    $('#hBloque').textContent = val;
    toast(`Bloque: ${val}`);
  }
  cerrarModal();
  render();
}

/* ================== VISTA: REGISTRO (DIRECTA Y LIMPIA) ================== */
function vRegistro(){
  const s = cur();
  const k = calcSession(s);
  const adentroList = s.people.filter(p => p.A && !p.D && p.obs !== 'AB' && p.obs !== 'PE');
  const nowSeg = toS(nowT());

  let h = '';

  // Alerta de corte de 10 min si está pendiente
  if(s.inicio && !s.fin){
    const nextCut = toS(s.inicio) + 600 * (s.cortes.length + 1);
    const left = nextCut - nowSeg;
    if(left <= 0){
      h += `<div class="alert">
        <span>📸 ¡Toca hacer el Corte ${s.cortes.length+1}!</span>
        <button class="btn sm pri" onclick="corteAuto()">Tomar Corte</button>
      </div>`;
    }
  }

  // Barra de resumen táctil
  h += `
  <div class="stats-bar">
    <div class="stat-box"><b>${k.total}</b><span>Llegadas</span></div>
    <div class="stat-box" style="border:1px solid var(--pri)"><b>${k.adentro}</b><span style="color:var(--pri)">Adentro</span></div>
    <div class="stat-box"><b>${k.comp}</b><span>Salieron</span></div>
    <div class="stat-box"><b>${dur(k.w)}</b><span>Estancia</span></div>
  </div>`;

  // BOTÓN GIGANTE DE ENTRADA
  h += `
  <div class="tap-zone">
    <button class="btn-entry" onclick="entradaRapida()">
      ＋ REGISTRAR ENTRADA
      <span>Hora de llegada automática al tocar</span>
    </button>
  </div>`;

  // Control de sesión discreto
  h += `
  <div class="row" style="justify-content:space-between;margin:6px 0 12px;font-size:12px;color:var(--mut)">
    <span>Sesión ${s.num} (${s.fecha}) · ${s.inicio ? 'Inicio: '+s.inicio : 'Aún no inicia'}</span>
    <div class="row">
      <button class="btn sm" onclick="nuevaSesion()">＋ Nueva Sesión</button>
      <button class="btn sm bad" onclick="deshacerUltima()">↶ Deshacer</button>
    </div>
  </div>`;

  // LISTA DE PERSONAS ACTUALMENTE ADENTRO
  h += `<div class="card">
    <h2>
      <span>🚶 Personas en el bloque (${adentroList.length})</span>
      <small class="muted">Toca "Salida" cuando salgan</small>
    </h2>`;

  if(adentroList.length === 0){
    h += `<p class="muted" style="text-align:center;padding:16px 0">No hay nadie dentro ahora mismo.<br>Toca <b>＋ REGISTRAR ENTRADA</b> cuando alguien llegue.</p>`;
  } else {
    adentroList.slice().reverse().forEach(p => {
      const transcurrido = nowSeg ? nowSeg - toS(p.A) : 0;
      const badgeCls = p.C ? 'ok' : (p.B ? 'blue' : 'warn');

      h += `
      <div class="p-card ${p.B ? 'atencion' : 'cola'}">
        <div class="p-top">
          <div class="row">
            <span class="p-id">#${p.n}</span>
            <input class="p-tag-input" value="${esc(p.nombre||'')}" placeholder="Nota/Nombre (opcional)" onchange="setPersonaTag(${p.n}, this.value)">
          </div>
          <div class="p-time">
            Llegó: <b>${p.A}</b> · <span class="badge ${badgeCls}">${dur(transcurrido)}</span>
          </div>
        </div>

        <div class="p-actions">
          <!-- BOTÓN DIRECTO DE SALIDA -->
          <button class="btn warn sm" style="font-weight:700;padding:8px 14px" onclick="marcarSalida(${p.n})">
            🚪 MARCAR SALIDA
          </button>

          <!-- BOTONES SECUNDARIOS DE ATENCIÓN EN VENTANILLA -->
          ${!p.B ? `
            <button class="btn sm blue" onclick="marcarPaso(${p.n},'B')">▶ Inició atención</button>
          ` : (!p.C ? `
            <button class="btn sm pri" onclick="marcarPaso(${p.n},'C')">✔ Fin atención</button>
          ` : `
            <span class="badge ok">Atendido</span>
          `)}

          <!-- INCIDENCIAS RÁPIDAS -->
          <button class="btn sm ${p.obs==='AB'?'bad':''}" title="Abandonó la fila" onclick="setObsPersona(${p.n},'AB')">AB</button>
          <button class="btn sm ${p.obs==='PE'?'bad':''}" title="Dato perdido" onclick="setObsPersona(${p.n},'PE')">PE</button>
        </div>
      </div>`;
    });
  }
  h += `</div>`;

  // HISTORIAL DE HOY (TABLA)
  h += `
  <div class="card">
    <h2>
      <span>📋 Historial de personas (${s.people.length})</span>
    </h2>
    <div class="tbl">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Llegada</th>
            <th>Salida</th>
            <th>Estancia</th>
            <th>Atención</th>
            <th>Obs</th>
          </tr>
        </thead>
        <tbody>
          ${s.people.slice().reverse().map(p => {
            const estancia = toS(p.A)!=null && toS(p.D)!=null ? dur(toS(p.D)-toS(p.A)) : '—';
            const atencion = toS(p.B)!=null && toS(p.C)!=null ? dur(toS(p.C)-toS(p.B)) : '—';
            return `
            <tr>
              <td><b>#${p.n}</b> ${esc(p.nombre||'')}</td>
              <td>${p.A||'—'}</td>
              <td>${p.D||'<span class="badge warn">Adentro</span>'}</td>
              <td>${estancia}</td>
              <td>${atencion}</td>
              <td><span class="badge ${p.obs?'bad':''}">${p.obs||'—'}</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>`;

  return h;
}

/* ================== VISTA: CORTES CADA 10 MIN ================== */

/* ================== VISTA: MÉTRICAS Y DATOS PARA UNITY ================== */
function vResumen(){
  const s = cur();
  const k = calcSession(s);
  const ks = S.sessions.map(calcSession);
  const m = f => r2(avg(ks.map(f).filter(x=>x!=null&&!isNaN(x))));
  const mm = f => {
    const v = avg(ks.map(f).filter(x=>x!=null&&!isNaN(x)));
    return v==null ? '—' : r2(v/60)+' min ('+Math.round(v)+' s)';
  };

  const consolidados = [
    ['Personas promedio por sesión (llegadas)', m(x=>x.total)],
    ['Tiempo promedio de recorrido en bloque (D−A)', mm(x=>x.w)],
    ['Tiempo promedio de espera en cola (B−A)', mm(x=>x.wq)],
    ['Tiempo promedio de atención en ventanilla (C−B)', mm(x=>x.ws)],
    ['Capacidad del espacio (espera / aforo)', (S.cfg.capEspera||'—')+' / '+(S.cfg.aforo||'—')],
    ['Frecuencia de llegada λ (personas/minuto)', m(x=>x.lambda)],
    ['Frecuencia de llegada (personas/hora)', r2(m(x=>x.lambda)*60)],
    ['Tiempo promedio entre llegadas (s)', m(x=>x.inter)+' s'],
    ['Cola promedio observada', m(x=>x.colaProm)],
    ['Utilización promedio de servidores ρ', m(x=>x.util) ? Math.round(m(x=>x.util)*100)+'%' : '—']
  ];

  return `
  <div class="card">
    <h2>🧩 Datos para la Simulación en Unity</h2>
    <p class="muted">Aquí tienes directamente la tabla solicitada para calibrar tu modelo en Unity:</p>
    <table>
      <thead>
        <tr>
          <th style="text-align:left">Variable</th>
          <th>Dato Observado Real</th>
          <th>Valor usado en Unity</th>
        </tr>
      </thead>
      <tbody>
        ${consolidados.map(r => `
          <tr>
            <td style="text-align:left"><b>${r[0]}</b></td>
            <td><span class="badge ok">${r[1]}</span></td>
            <td><input value="${esc(S.cfg.unity[r[0]]||'')}" placeholder="Ej: ${r[1]}" onchange="S.cfg.unity['${r[0]}']=this.value;save()"></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  </div>

  <div class="card">
    <h2>📊 Resumen de la Sesión Actual (#${s.num})</h2>
    <table>
      <tr><td style="text-align:left">Total de llegadas registradas</td><td><b>${k.total}</b></td></tr>
      <tr><td style="text-align:left">Total salidas completas</td><td><b>${k.comp}</b></td></tr>
      <tr><td style="text-align:left">Personas aún en el bloque</td><td><b>${k.adentro}</b></td></tr>
      <tr><td style="text-align:left">Tiempo prom. de recorrido (D−A)</td><td><b>${dur(k.w)}</b></td></tr>
      <tr><td style="text-align:left">Tiempo prom. entre llegadas</td><td><b>${dur(k.inter)}</b></td></tr>
      <tr><td style="text-align:left">Cortes de 10 min realizados</td><td><b>${k.cortes} / 6</b></td></tr>
      <tr><td style="text-align:left">Abandonos (AB)</td><td><b>${k.ab}</b></td></tr>
    </table>
  </div>`;
}

/* ================== VISTA: EXPORTAR ================== */
function vDatos(){
  return `
  <div class="card">
    <h2>💾 Descargar Archivos para la Entrega</h2>
    <p class="muted">Genera el archivo oficial <b>${fname('xlsx')}</b> con las 5 hojas requeridas por la universidad.</p>
    <div class="row" style="margin-bottom:12px">
      <button class="btn pri" onclick="exportXLSX()">⬇ Descargar Excel (.xlsx)</button>

      <label class="btn" style="margin:0;cursor:pointer">⬆ Restaurar JSON<input type="file" accept=".json" style="display:none" onchange="importJSON(this.files[0])"></label>
    </div>
  </div>

  <div class="card">
    <h2>Sesiones Guardadas (${S.sessions.length})</h2>

      <div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)">

        <button class="btn sm bad" onclick="if(confirm('¿Borrar Sesión ${s.num}?')){S.sessions=S.sessions.filter(x=>x.id!==${s.id});if(S.cur===${s.id})S.cur=S.sessions[0]?.id;save();render()}">Borrar</button>

/* ================== VISTA: BLOQUE / PARÁMETROS UNIVERSIDAD (OPCIONAL) ================== */
function vBloque(){
  const c = S.cfg;
  const f = (k,l,ph='',type='text') => `<div><label>${l}</label><input type="${type}" value="${esc(c[k])}" placeholder="${ph}" onchange="S.cfg['${k}']=this.value;save();hdr()"></div>`;
  const sel = (k,l,ops) => `<div><label>${l}</label><select onchange="S.cfg['${k}']=this.value;save()">${ops.map(o=>`<option ${c[k]===o?'selected':''}>${o}</option>`).join('')}</select></div>`;

  return `
  <div class="card">
    <h2>🏢 Datos del Bloque (Pre-llenados)</h2>
    <p class="muted">Estos datos ya tienen valores por defecto para que no pierdas tiempo. Modifícalos solo si deseas ajustarlos para el Excel.</p>
    <div class="grid">
      ${f('bloque','Bloque en observación','Bloque Administrativo A')}
      ${f('zona','Zona','Zona 1')}
      ${f('est1','Estudiante (Tú)','Balmes')}
      ${f('est2','Compañero (opcional)','')}
      ${f('punto','Punto exacto observado','Entrada principal / Bloque Adm A')}
      ${f('horario','Horario','Hora pico')}
    </div>
  </div>

  <div class="card">
    <h2>⚙️ Formato 1 · Parámetros Estructurales</h2>
    <div class="grid">
      ${f('c','Número de servidores / ventanillas (c)','1','number')}
      ${sel('iguales','¿Servidores iguales?',['Sí','No'])}
      ${f('accesos','Accesos del bloque','1 acceso')}
      ${sel('disciplina','Disciplina de cola',['FIFO','Prioridad','Sin orden'])}
      ${sel('fila','Tipo de fila',['Una sola fila','Una por servidor'])}
      ${f('capEspera','Capacidad de espera (personas)','20','number')}
      ${f('aforo','Aforo total del bloque','50','number')}
    </div>
    <div style="margin-top:12px">
      <button class="btn pri" onclick="tab='registro';render()">← Volver al Registro</button>
    </div>
  </div>`;
}

/* ================== EXPORTACIÓN EXCEL ================== */
function fname(ext){
  const c = S.cfg;
  const cl = x => String(x||'').replace(/[^\w]+/g,'');
  return `${cl(c.zona)||'Zona1'}_${cl(c.bloque)||'BloqueAdmin'}_${cl(c.est1)||'Balmes'}.${ext}`;
}
function allPeople(){ return S.sessions.flatMap(s => s.people.map(p => ({...p, s}))); }

function rowsLlegadas(){
  return allPeople().map(p => {
    const d = (a,b) => toS(p[a])!=null && toS(p[b])!=null ? toS(p[b])-toS(p[a]) : '';
    return {
      'Sesión': p.s.num,
      'Fecha': p.s.fecha,
      'Día': p.s.dia,
      'Bloque': S.cfg.bloque,
      'N°': p.n,
      'Etiqueta / Nota': p.nombre || '',
      'A. Llegada': p.A,
      'B. Inicio atención': p.B,
      'C. Fin atención': p.C,
      'D. Salida': p.D,
      'Espera en cola B-A (s)': d('A','B'),
      'Atención C-B (s)': d('B','C'),
      'Tiempo recorrido en bloque D-A (s)': d('A','D'),
      'Obs': p.obs
    };
  });
}

function exportXLSX(){
  if(!window.XLSX){ toast('Sin librería Excel. Use CSV.'); return; }
  const wb = XLSX.utils.book_new(), c = S.cfg;

  // Hoja 1: Parámetros del Bloque
  const f1 = [
    ['UNIVERSIDAD DE LA GUAJIRA - SIMULACIÓN'],
    ['FORMATO DE TOMA DE DATOS EN BLOQUES'],
    [],
    ['Zona', c.zona],
    ['Bloque', c.bloque],
    ['Estudiante 1', c.est1],
    ['Estudiante 2', c.est2],
    ['Punto observado', c.punto],
    ['Horario', c.horario],
    [],
    ['PARÁMETROS ESTRUCTURALES (FORMATO 1)', 'VALOR'],
    ['Número de servidores (c)', c.c],
    ['¿Servidores iguales?', c.iguales],
    ['Accesos del bloque', c.accesos],
    ['Disciplina de la cola', c.disciplina],
    ['Tipo de fila', c.fila],
    ['Capacidad de la zona de espera', c.capEspera],
    ['Aforo publicado', c.aforo]
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(f1), 'Bloque (F1)');

  // Hoja 2: Registro
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rowsLlegadas()), 'Registro (Hoja 3)');

  // Hoja 3: Cortes cada 10 min
  const rCortes = S.sessions.flatMap(s => s.cortes.map(k => ({
    'Sesión': s.num,
    'Fecha': s.fecha,
    'Corte N°': k.n,
    'Hora': k.hora,
    'Llegadas en 10 min': k.llegadas,
    'Personas en cola': k.cola,
    'Servidores ocupados': k.ocup
  })));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rCortes), 'Cortes (F3)');

  // Hoja 4: Métricas Unity
  const ks = S.sessions.map(calcSession);
  const m = f => r2(avg(ks.map(f).filter(x=>x!=null&&!isNaN(x))));
  const tUnity = [
    ['Variable para Unity', 'Datos Observados', 'Valor utilizado en Unity'],
    ['Personas promedio', m(x=>x.total), c.unity['Personas promedio por sesión (llegadas)']||m(x=>x.total)],
    ['Tiempo promedio de recorrido', r2(m(x=>x.w)/60)+' min', c.unity['Tiempo promedio de recorrido en bloque (D−A)']||r2(m(x=>x.w)/60)+' min'],
    ['Tiempo promedio de espera', r2(m(x=>x.wq)/60)+' min', c.unity['Tiempo promedio de espera en cola (B−A)']||'0 min'],
    ['Capacidad del espacio', c.capEspera + ' / ' + c.aforo, c.capEspera],
    ['Frecuencia de llegada', m(x=>x.lambda)+' pers/min', c.unity['Frecuencia de llegada λ (personas/minuto)']||m(x=>x.lambda)]
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(tUnity), 'Consolidación Unity');

  XLSX.writeFile(wb, fname('xlsx'));
}

function dl(name, data, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type}));
  a.download = name;
  a.click();
}
function exportCSV(){
  const r = rowsLlegadas();
  if(!r.length) return toast('Sin datos');
  const h = Object.keys(r[0]);
  dl(fname('csv'), '\ufeff' + [h.join(';'), ...r.map(x=>h.map(k=>`"${String(x[k]).replace(/"/g,'""')}"`).join(';'))].join('\n'), 'text/csv');
}
function exportJSON(){ dl(fname('json'), JSON.stringify(S, null, 1), 'application/json'); }
function importJSON(f){
  if(!f) return;
  f.text().then(t => {
    try {
      const d = JSON.parse(t);
      if(!d.cfg || !d.sessions) throw 0;
      if(confirm('¿Reemplazar datos actuales con el respaldo?')){
        S = d;
        save();
        render();
        toast('Datos cargados');
      }
    }catch(e){ alert('Archivo inválido'); }
  });
}

/* ================== RENDER & RELOJ ================== */
function hdr(){
  $('#hBloque').textContent = S.cfg.bloque || 'Bloque Administrativo A';
}
function render(){
  const y = scrollY;
  $('#app').innerHTML = {
    registro: vRegistro,
    cortes: vCortes,
    resumen: vResumen,
    datos: vDatos,
    bloque: vBloque
  }[tab]();

  document.querySelectorAll('nav button').forEach(b => {
    b.classList.toggle('on', b.dataset.t === tab);
  });
  hdr();
  scrollTo(0, y);
}

document.querySelectorAll('nav button').forEach(b => {
  b.onclick = () => {
    tab = b.dataset.t;
    render();
    scrollTo(0, 0);
  };
});

setInterval(() => {
  $('#clock').textContent = nowT();
  const s = cur();
  if(!s || !s.inicio || s.fin) return;
  if(tab === 'registro'){
    const nowSeg = toS(nowT());
    const nextCut = toS(s.inicio) + 600 * (s.cortes.length + 1);
    const left = nextCut - nowSeg;
    if(left === 0){
      beep(700, .4);
      vib([200,100,200]);
      render();
    }
  }
}, 1000);

render();
</script>
