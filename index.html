<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b3d2e">
<title>Registro Bloque Administrativo · Uniguajira</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0c1411;--card:#14201b;--card2:#1c2d26;--card3:#243a31;--txt:#e9f3ee;--mut:#8fa69b;--pri:#1fb978;--pri2:#15915d;--warn:#f0b429;--bad:#e5484d;--blue:#3b82f6;--purple:#a855f7;--bd:#263830}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:84px;user-select:none}
header{position:sticky;top:0;z-index:20;background:#09251c;border-bottom:1px solid var(--bd);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hdr-main{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.bloque-chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--bd);border-radius:20px;padding:4px 10px;font-size:13px;font-weight:700;color:var(--pri);max-width:100%;cursor:pointer}
.bloque-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#clock{font:700 20px ui-monospace,Consolas,monospace;color:#a3e6cb}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#091511;border-top:1px solid var(--bd);z-index:30}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 2px 10px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:18px}
nav button.on{color:var(--pri);font-weight:700}
main{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
label{display:block;font-size:12px;color:var(--mut);margin:6px 0 3px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--bd);color:var(--txt);border-radius:8px;padding:9px;font-size:14px;user-select:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 12px}
.btn{background:var(--card2);color:var(--txt);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;font-size:13px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#03140c}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#241a00}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.purple{background:#a855f725;border-color:#a855f788;color:#c084fc}
.btn.sm{padding:5px 8px;font-size:11px;border-radius:7px}
.btn:active{transform:scale(.97)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* SELECTOR DE PUERTAS (DELANTERA / TRASERA) */
.door-switch{display:flex;background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:4px;gap:6px;margin:6px 0}
.door-tab{flex:1;background:none;border:1px solid transparent;color:var(--mut);padding:8px 6px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s ease}
.door-tab.sel-del{background:#1fb97825;color:#4ade80;border-color:#1fb97888}
.door-tab.sel-tras{background:#3b82f625;color:#60a5fa;border-color:#3b82f688}

/* SELECTOR DE TIPO (ESTUDIANTE / FUNCIONARIO) */
.type-switch{display:flex;background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:4px;gap:6px;margin:6px 0}
.type-tab{flex:1;background:none;border:1px solid transparent;color:var(--mut);padding:8px 6px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s ease}
.type-tab.sel-est{background:#1fb97825;color:#4ade80;border-color:#1fb97888}
.type-tab.sel-func{background:#a855f725;color:#c084fc;border-color:#a855f788}

/* ESTADO DE SESIÓN */
.sess-bar{background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sess-bar.running{border-color:#1fb97866;background:#0e291e}
.sess-bar.closed{border-color:#f0b42966;background:#241f14}

/* BOTONES GIGANTES DE ENTRADA Y START */
.tap-zone{display:grid;grid-template-columns:1fr;gap:10px;margin:8px 0}
.btn-start{width:100%;padding:24px 12px;font-size:22px;font-weight:800;border-radius:16px;background:linear-gradient(180deg,#2ad38d,#15935d);border:0;color:#02140a;cursor:pointer;box-shadow:0 6px 20px #1fb97855;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.btn-start:active{transform:scale(.98);filter:brightness(1.1)}
.btn-start span{font-size:12px;font-weight:600;opacity:.85;letter-spacing:.3px}

.btn-entry{width:100%;padding:24px 12px;font-size:22px;font-weight:800;border-radius:16px;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;user-select:none}
.btn-entry:active{transform:scale(.98);filter:brightness(1.1)}
.btn-entry span{font-size:12px;font-weight:600;opacity:.9;letter-spacing:.3px}
.btn-del{background:linear-gradient(180deg,#2ad38d,#15935d);color:#02140a;box-shadow:0 6px 18px #1fb97844}
.btn-tras{background:linear-gradient(180deg,#4f9cf8,#2563eb);color:#ffffff;box-shadow:0 6px 18px #3b82f644}

/* TARJETAS DE PERSONAS ADENTRO */
.p-card{background:var(--card2);border:1px solid var(--bd);border-left:4px solid var(--pri);border-radius:12px;padding:10px;margin-bottom:8px}
.p-card.trasera{border-left-color:var(--blue)}
.p-card.piso2{border-left-color:var(--purple)}
.p-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:6px}
.p-id{font-weight:800;font-size:15px;color:var(--txt)}
.p-time{font:12px ui-monospace,Consolas,monospace;color:#a7c4b7}
.p-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.p-tag-input{background:none;border:0;border-bottom:1px dashed var(--bd);color:#cbdad2;font-size:12px;padding:2px 4px;width:120px}
.p-tag-input:focus{outline:0;border-bottom-color:var(--pri)}

.badge{display:inline-block;padding:2px 7px;border-radius:99px;font-size:11px;font-weight:700}
.badge.ok{background:#1fb97825;color:#4ade80}
.badge.warn{background:#f0b42925;color:#fbbf24}
.badge.blue{background:#3b82f625;color:#60a5fa}
.badge.purple{background:#a855f725;color:#c084fc}
.badge.bad{background:#e5484d25;color:#f87171}

.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.stat-box{background:var(--card2);border-radius:10px;padding:8px 4px;text-align:center}
.stat-box b{display:block;font-size:18px;color:var(--txt)}
.stat-box span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px}

.alert{background:var(--warn);color:#241a00;padding:10px 12px;border-radius:10px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.2)}}

table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid var(--bd);padding:6px 4px;text-align:center}
th{color:var(--mut);font-weight:600;background:var(--card)}
.tbl{overflow:auto;max-height:50vh}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#000000dd;border:1px solid #ffffff22;color:#fff;padding:8px 16px;border-radius:99px;font-size:13px;z-index:99;pointer-events:none}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;height:42px;font-size:22px;border-radius:10px}
.step b{min-width:36px;text-align:center;font-size:22px}
.muted{color:var(--mut);font-size:12px}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-body{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;width:100%;max-width:400px}
.cloud-pill{display:inline-flex;align-items:center;gap:4px;background:var(--card2);border:1px solid #1fb97866;border-radius:20px;padding:4px 8px;font-size:11px;font-weight:700;color:#4ade80;cursor:pointer;white-space:nowrap;user-select:none;transition:all .2s ease}
.cloud-pill.syncing{border-color:#3b82f688;color:#60a5fa}
.cloud-pill.offline{border-color:#f0b42988;color:#fbbf24}
.cloud-pill.error{border-color:#e5484d88;color:#f87171}
</style>
</head>
<body>
<header>
  <div class="hdr-main">
    <div class="bloque-chip" onclick="abrirCambioBloque()" title="Cambiar bloque">
      🏢 <span id="hBloque">Bloque Administrativo A</span> ✏️
    </div>
    <div id="cloudPill" class="cloud-pill" onclick="sincronizarSupabase(true)" title="Toca para sincronizar con Supabase">
      <span id="cloudDot">🟢</span> <span id="cloudTxt">Nube OK</span>
    </div>
  </div>
  <div id="clock">--:--:--</div>
</header>

<main id="app"></main>

<nav>
  <button data-t="registro" class="on"><b>⏱️</b>Registro</button>
  <button data-t="cortes"><b>📸</b>Cortes</button>
  <button data-t="resumen"><b>📊</b>Métricas</button>
  <button data-t="datos"><b>💾</b>Exportar</button>
  <button data-t="bloque"><b>⚙️</b>Bloque</button>
</nav>

<div id="modalSlot"></div>

<script>
/* ================== CONFIGURACIÓN INICIAL ================== */
const KEY = 'regBloques_v2';
const defCfg = {
  bloque: 'Bloque Administrativo A',
  zona: 'Zona 1',
  est1: 'Balmes',
  est2: '',
  punto: 'Puerta delantera y trasera · 2 Pisos',
  horario: 'Hora pico',
  c: 1,
  iguales: 'Sí',
  accesos: '2 accesos (Delantera y Trasera)',
  disciplina: 'FIFO',
  fila: 'Una sola fila',
  capEspera: '25',
  turnos: 'Jornada continua',
  abandono: 'No',
  abandonoHora: '0',
  aforo: '60',
  seguirCada: 1,
  unity: {}
};

let S = JSON.parse(localStorage.getItem(KEY) || 'null');
if(!S){
  const old = localStorage.getItem('regBloques_v1');
  if(old){
    try{ S = JSON.parse(old); }catch(e){}
  }
}
if(!S){
  S = { cfg: {...defCfg}, sessions: [], cur: null };
}
S.cfg = { ...defCfg, ...S.cfg };

const dNow = new Date();
const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

function crearNuevaSesionObj(num){
  const d = new Date();
  return {
    id: Date.now(),
    num: num || 1,
    titulo: '',
    notas: '',
    fecha: d.toISOString().slice(0,10),
    dia: dias[d.getDay()],
    inicio: '',
    fin: '',
    people: [],
    cortes: [],
    clima: 'Normal / Despejado',
    anormal: '',
    franja: 'Hora pico'
  };
}

if(!S.sessions || S.sessions.length === 0){
  const s0 = crearNuevaSesionObj(1);
  S.sessions = [s0];
  S.cur = s0.id;
} else if(!S.cur){
  S.cur = S.sessions[S.sessions.length - 1].id;
}

let tab = 'registro';
let puertaActual = 'Delantera';
let tipoActual = 'Estudiante';

/* ================== CONEXIÓN SUPABASE EN TIEMPO REAL ================== */
const SB_URL = 'https://mljrlfxhyjegrmqdbscp.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1sanJsZnhoeWplZ3JtcWRic2NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1Njc4OTEsImV4cCI6MjEwOTE0Mzg5MX0.IFdEzlOgzxXba6K_l3s3OgurscfPn0ce9z-9uiS2FVE';
const SB_TABLE = 'simulacion_bloques';

let sb = null;
try {
  if(window.supabase && typeof window.supabase.createClient === 'function'){
    sb = window.supabase.createClient(SB_URL, SB_KEY, {
      auth: { persistSession: false, autoRefreshToken: false }
    });
  }
} catch(err){
  console.warn('Init Supabase:', err);
}

let syncStatus = 'ok';
let syncTimer = null;
let lastSyncTime = null;

function setCloudStatus(st, msg = null){
  syncStatus = st;
  const pill = document.getElementById('cloudPill');
  const dot = document.getElementById('cloudDot');
  const txt = document.getElementById('cloudTxt');
  const cardB = document.getElementById('cloudCardBadge');
  if(!pill || !dot || !txt) return;

  pill.className = 'cloud-pill ' + st;
  if(st === 'syncing'){
    dot.textContent = '🔄';
    txt.textContent = msg || 'Guardando...';
    if(cardB){ cardB.className = 'badge blue'; cardB.textContent = '🔄 Sincronizando...'; }
  } else if(st === 'ok'){
    dot.textContent = '🟢';
    txt.textContent = msg || 'Nube OK';
    pill.title = `Sincronizado con Supabase (${lastSyncTime || 'al día'})`;
    if(cardB){ cardB.className = 'badge ok'; cardB.textContent = '🟢 Conectado a Supabase'; }
  } else if(st === 'offline'){
    dot.textContent = '🟡';
    txt.textContent = msg || 'Solo Local';
    pill.title = 'Sin conexión a internet. Los datos están seguros en este celular.';
    if(cardB){ cardB.className = 'badge warn'; cardB.textContent = '🟡 Sin Internet (Guardado Local)'; }
  } else if(st === 'error'){
    dot.textContent = '🔴';
    txt.textContent = msg || 'Reintentar';
    pill.title = 'Error de conexión. Toca para reintentar sincronizar.';
    if(cardB){ cardB.className = 'badge bad'; cardB.textContent = '🔴 Error de Conexión'; }
  }
}

async function upsertSesionRemota(s){
  const row = {
    id: 'sess_' + s.id,
    num: s.num,
    bloque: S.cfg.bloque || 'Bloque Administrativo A',
    fecha: s.fecha || new Date().toISOString().slice(0,10),
    data: {
      cfg: S.cfg,
      session: s,
      savedAt: new Date().toISOString()
    },
    updated_at: new Date().toISOString()
  };

  if(sb){
    const { error } = await sb.from(SB_TABLE).upsert(row, { onConflict: 'id' });
    if(error) throw error;
    return true;
  }

  const res = await fetch(`${SB_URL}/rest/v1/${SB_TABLE}`, {
    method: 'POST',
    headers: {
      'apikey': SB_KEY,
      'Authorization': `Bearer ${SB_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates'
    },
    body: JSON.stringify(row)
  });
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  return true;
}

async function sincronizarSupabase(manual = false){
  if(!navigator.onLine){
    setCloudStatus('offline');
    if(manual) toast('Sin internet: guardado en este dispositivo');
    return;
  }

  setCloudStatus('syncing');
  if(manual) toast('Subiendo datos a Supabase...');

  try {
    for(const s of S.sessions){
      await upsertSesionRemota(s);
    }
    lastSyncTime = nowT();
    setCloudStatus('ok', 'Nube OK');
    if(manual) toast(`✔ ${S.sessions.length} sesión(es) respaldadas en Supabase`);
  } catch(err){
    console.error('Error sincronizando con Supabase:', err);
    setCloudStatus('error', 'Error Nube');
    if(manual) toast('Error al conectar con Supabase. Revisa tu señal.');
  }
}

async function descargarDesdeSupabase(manual = false){
  if(!navigator.onLine){
    if(manual) toast('Sin internet: no se puede consultar Supabase');
    return;
  }

  setCloudStatus('syncing', 'Descargando...');
  if(manual) toast('Consultando sesiones en Supabase...');

  try {
    let remoteRows = [];
    if(sb){
      const { data, error } = await sb.from(SB_TABLE).select('*').order('num', { ascending: true });
      if(error) throw error;
      remoteRows = data || [];
    } else {
      const res = await fetch(`${SB_URL}/rest/v1/${SB_TABLE}?select=*&order=num.asc`, {
        headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
      });
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      remoteRows = await res.json();
    }

    if(!remoteRows || !remoteRows.length){
      setCloudStatus('ok');
      if(manual) toast('No hay sesiones previas en Supabase');
      return;
    }

    let cambios = 0;
    remoteRows.forEach(row => {
      const remS = row.data && row.data.session;
      if(!remS) return;

      const idx = S.sessions.findIndex(x => x.id === remS.id);
      if(idx === -1){
        S.sessions.push(remS);
        cambios++;
      } else {
        const locS = S.sessions[idx];
        const remP = (remS.people||[]).length;
        const locP = (locS.people||[]).length;
        const remD = (remS.people||[]).filter(p=>p.D).length;
        const locD = (locS.people||[]).filter(p=>p.D).length;
        if(remP > locP || (remP === locP && remD > locD) || (remP === locP && remS.fin && !locS.fin)){
          S.sessions[idx] = remS;
          cambios++;
        }
      }

      if(row.data && row.data.cfg){
        S.cfg = { ...S.cfg, ...row.data.cfg };
      }
    });

    if(cambios > 0){
      localStorage.setItem(KEY, JSON.stringify(S));
      render();
      if(manual) toast(`✔ Se actualizaron ${cambios} sesiones desde Supabase`);
    } else if(manual){
      toast('✔ Sesiones ya sincronizadas con la nube');
    }

    lastSyncTime = nowT();
    setCloudStatus('ok');
  } catch(err){
    console.error('Error descargando de Supabase:', err);
    setCloudStatus('error');
    if(manual) toast('Error al traer datos de Supabase');
  }
}

function triggerAutoSync(){
  clearTimeout(syncTimer);
  setCloudStatus('syncing', 'Guardando...');
  syncTimer = setTimeout(() => {
    sincronizarSupabase(false);
  }, 1200);
}

async function borrarSesion(id, num){
  if(!confirm(`¿Borrar definitivamente la Sesión ${num}?`)) return;
  S.sessions = S.sessions.filter(x => x.id !== id);
  if(!S.sessions.length){
    const s0 = crearNuevaSesionObj(1);
    S.sessions = [s0];
    S.cur = s0.id;
  } else if(S.cur === id){
    S.cur = S.sessions[0].id;
  }
  save();
  render();

  try {
    if(sb){
      await sb.from(SB_TABLE).delete().eq('id', 'sess_' + id);
    } else {
      await fetch(`${SB_URL}/rest/v1/${SB_TABLE}?id=eq.sess_${id}`, {
        method: 'DELETE',
        headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
      });
    }
  } catch(e){
    console.warn('Error borrando en Supabase:', e);
  }
  toast(`Sesión ${num} eliminada`);
}

window.addEventListener('online', () => {
  toast('📡 Conexión restaurada: sincronizando con Supabase...');
  sincronizarSupabase(false);
});
window.addEventListener('offline', () => {
  setCloudStatus('offline');
});

const save = () => {
  localStorage.setItem(KEY, JSON.stringify(S));
  triggerAutoSync();
};
const cur = () => S.sessions.find(s => s.id === S.cur) || S.sessions[S.sessions.length - 1];
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const nowT = () => {
  const d = new Date();
  return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
};
const toS = t => {
  if(!t || !/^\d{1,2}:\d{2}(:\d{2})?$/.test(t)) return null;
  const p = t.split(':').map(Number);
  return p[0]*3600 + p[1]*60 + (p[2]||0);
};
const fromS = s => {
  s = ((s%86400)+86400)%86400;
  return pad(Math.floor(s/3600)) + ':' + pad(Math.floor(s%3600/60)) + ':' + pad(Math.floor(s%60));
};
const dur = s => s == null || isNaN(s) ? '—' : (s < 0 ? '-' : '') + Math.floor(Math.abs(s)/60) + 'm ' + pad(Math.round(Math.abs(s)%60)) + 's';
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const sd = a => {
  if(a.length < 2) return null;
  const m = avg(a);
  return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1));
};
const r2 = x => x == null || isNaN(x) ? '' : Math.round(x*100)/100;
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(m){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = m;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 1600);
}
function beep(f=880, d=.12){
  try{
    const a = new (window.AudioContext||window.webkitAudioContext)();
    const o = a.createOscillator(), g = a.createGain();
    o.frequency.value = f;
    o.connect(g);
    g.connect(a.destination);
    g.gain.value = .18;
    o.start();
    o.stop(a.currentTime+d);
  }catch(e){}
}
function vib(p=35){ if(navigator.vibrate) navigator.vibrate(p); }

/* ================== CÁLCULOS INTEGRALES ================== */
function calcSession(s){
  if(!s) return {};
  const c = +S.cfg.c || 1;
  const P = s.people || [];
  const llegadasReales = P.filter(p => !p.previo && p.obs !== 'YA_ESTABA');
  const previas = P.filter(p => p.previo || p.obs === 'YA_ESTABA');

  const arr = llegadasReales.filter(p=>p.obs!=='PE' && toS(p.A)!=null).map(p=>toS(p.A)).sort((a,b)=>a-b);
  const inter = [];
  for(let i=1; i<arr.length; i++) inter.push(arr[i]-arr[i-1]);

  const comp = llegadasReales.filter(p => toS(p.A)!=null && toS(p.D)!=null);
  const w = comp.map(p => toS(p.D) - toS(p.A));
  
  const conAtencion = P.filter(p => toS(p.A)!=null && toS(p.B)!=null && toS(p.C)!=null);
  const wq = conAtencion.map(p => toS(p.B) - toS(p.A));
  const ws = conAtencion.map(p => toS(p.C) - toS(p.B));

  const ini = toS(s.inicio) ?? (arr.length ? arr[0] : null);
  const fin = toS(s.fin) ?? (toS(nowT()));
  const durMin = ini!=null && fin!=null ? Math.max(1, (fin-ini)/60) : null;

  const colas = (s.cortes||[]).map(k=>+k.cola).filter(x=>!isNaN(x));
  const ocup = (s.cortes||[]).map(k=>+k.ocup).filter(x=>!isNaN(x));

  const adentro = P.filter(p => !p.D && p.obs !== 'AB' && p.obs !== 'PE').length;

  const del = llegadasReales.filter(p => (p.puerta || 'Delantera') === 'Delantera').length;
  const tras = llegadasReales.filter(p => p.puerta === 'Trasera').length;

  const est = P.filter(p => (p.tipo || 'Estudiante') === 'Estudiante').length;
  const func = P.filter(p => p.tipo === 'Funcionario').length;

  const piso2 = P.filter(p => p.piso === 'Piso 2').length;
  const piso1 = P.length - piso2;

  const compP1 = comp.filter(p => p.piso !== 'Piso 2');
  const compP2 = comp.filter(p => p.piso === 'Piso 2');
  const wPiso1 = avg(compP1.map(p => toS(p.D) - toS(p.A)));
  const wPiso2 = avg(compP2.map(p => toS(p.D) - toS(p.A)));

  const conEscalera = P.filter(p => p.piso === 'Piso 2' && toS(p.horaPiso2)!=null && toS(p.A)!=null);
  const wEscalera = avg(conEscalera.map(p => toS(p.horaPiso2) - toS(p.A)));

  return {
    total: llegadasReales.length,
    totalRegistros: P.length,
    salidasPrevias: previas.length,
    validas: arr.length,
    comp: comp.length,
    adentro,
    del,
    tras,
    est,
    func,
    piso1,
    piso2,
    pctPiso2: P.length ? Math.round((piso2/P.length)*100) : 0,
    wPiso1,
    wPiso2,
    wEscalera,
    pe: P.filter(p=>p.obs==='PE').length,
    ab: P.filter(p=>p.obs==='AB').length,
    pr: P.filter(p=>p.obs==='PR').length,
    durMin,
    lambda: durMin ? arr.length/durMin : null,
    lambdaDel: durMin ? del/durMin : null,
    lambdaTras: durMin ? tras/durMin : null,
    inter: avg(inter),
    interSd: sd(inter),
    wq: avg(wq),
    ws: avg(ws),
    w: avg(w),
    wSd: sd(w),
    colaProm: avg(colas),
    colaMax: colas.length ? Math.max(...colas) : null,
    util: ocup.length ? avg(ocup)/c : null,
    cortes: (s.cortes||[]).length
  };
}

/* ================== CICLO DE VIDA DE SESIONES ================== */
function iniciarSesion(){
  const s = cur();
  if(!s) return;
  s.inicio = nowT();
  s.fin = '';
  save();
  beep(880, .2);
  vib([60, 40]);
  toast(`⏱️ Sesión ${s.num} iniciada: ${s.inicio}`);
  render();
}

function cerrarSesion(){
  const s = cur();
  if(!s) return;
  const adentro = s.people.filter(p => p.A && !p.D && p.obs !== 'AB' && p.obs !== 'PE').length;
  let confirmMsg = `¿Cerrar la Sesión ${s.num}?\n\n• Se registrará la hora actual (${nowT()}) como fin de la sesión.\n• Se guardará en el historial lista para descargar en Excel/JSON.\n• Se abrirá automáticamente una NUEVA sesión limpia.`;
  if(adentro > 0){
    confirmMsg += `\n\n⚠️ Atención: Aún hay ${adentro} persona(s) registradas como adentro.`;
  }
  if(!confirm(confirmMsg)) return;

  const hFin = nowT();
  s.fin = hFin;
  save();
  beep(440, .3);
  vib([100, 60, 100]);

  const nextNum = S.sessions.length + 1;
  const nextS = crearNuevaSesionObj(nextNum);
  S.sessions.push(nextS);
  S.cur = nextS.id;
  save();

  toast(`✔ Sesión ${s.num} cerrada a las ${hFin}. Nueva Sesión ${nextNum} lista.`);
  render();
}

function crearSiguienteSesionManual(){
  const nextNum = S.sessions.length + 1;
  const nextS = crearNuevaSesionObj(nextNum);
  S.sessions.push(nextS);
  S.cur = nextS.id;
  save();
  toast(`Nueva Sesión ${nextNum} creada`);
  render();
}

function reabrirSesion(id){
  const s = S.sessions.find(x => x.id === id);
  if(!s) return;
  if(confirm(`¿Deseas reabrir la Sesión ${s.num} para seguir registrando?`)){
    s.fin = '';
    S.cur = s.id;
    save();
    toast(`Sesión ${s.num} reabierta`);
    render();
  }
}

function setSessionTitulo(val){
  const s = cur();
  if(!s) return;
  s.titulo = val;
  s.notas = val;
  save();
}

function cambiarSesion(id){
  S.cur = id;
  save();
  render();
}

function deshacerUltima(){
  const s = cur();
  if(!s.people.length) return;
  const ult = s.people[s.people.length - 1];
  if(!confirm(`¿Eliminar la última llegada (#${ult.n} - ${ult.puerta||'Delantera'} - ${ult.tipo||'Estudiante'})?`)) return;
  s.people.pop();
  save();
  toast('Última llegada eliminada');
  render();
}

function corteAuto(){
  const s = cur();
  const h = nowT();
  const prev = s.cortes.length ? toS(s.cortes[s.cortes.length-1].hora) : toS(s.inicio);
  const hs = toS(h);
  const lleg = s.people.filter(p => {
    const a = toS(p.A);
    return a != null && (prev==null || a > prev) && a <= hs;
  }).length;
  const c = +S.cfg.c || 1;
  const adentro = s.people.filter(p => p.A && !p.D).length;
  s.cortes.push({
    n: s.cortes.length + 1,
    hora: h,
    llegadas: lleg,
    cola: Math.max(0, adentro - c),
    ocup: Math.min(adentro, c),
    libres: Math.max(0, c - adentro)
  });
  save();
  beep(600, .25);
  toast(`Corte ${s.cortes.length} registrado`);
  render();
}

          </button>

  if(s.people.length > 0 && !s.fin){

  if(adentroList.length === 0){
    h += `<p class="muted" style="text-align:center;padding:16px 0">${s.fin ? 'Sesión cerrada sin personas activas.' : 'No hay nadie dentro ahora mismo.<br>Toca <b>＋ REGISTRAR ENTRADA</b> cuando alguien llegue.'}</p>`;
  } else {
    adentroList.slice().reverse().forEach(p => {
      const refT = toS(p.A) ?? toS(s.inicio);
      const transcurrido = (nowSeg && refT != null) ? nowSeg - refT : 0;
      const esT = (p.puerta === 'Trasera');
      const esFunc = (p.tipo === 'Funcionario');
      const enP2 = (p.piso === 'Piso 2');

      h += `
      <div class="p-card ${enP2 ? 'piso2' : (esT ? 'trasera' : '')}">

            </span>
            <span class="badge ${esT ? 'blue' : 'ok'}" onclick="togglePuertaPersona(${p.n})" title="Toca para cambiar puerta" style="cursor:pointer">

            </span>
            <span class="badge ${enP2 ? 'purple' : 'warn'}" onclick="togglePisoPersona(${p.n})" title="Toca para cambiar piso" style="cursor:pointer">
              ${enP2 ? '🪜 Piso 2 (ORI/Grad/Doc)' : '📍 Piso 1'}

          </div>
          <div class="p-time">
            ${p.previo && !p.A ? '<b>Ya estaba</b>' : `Entró: <b>${p.A}</b>`} · <span class="badge ${p.C?'ok':(p.B?'warn':'ok')}">${dur(transcurrido)}</span>

        </div>

        <div class="p-actions">
          <button class="btn warn sm" style="font-weight:700;padding:8px 14px" onclick="marcarSalida(${p.n})">
            🚪 MARCAR SALIDA
          </button>

          ${!enP2 ? `
            <button class="btn purple sm" style="font-weight:700;padding:8px 12px" onclick="subirPiso2(${p.n})">
              🪜 Subió a Piso 2
            </button>
          ` : `
            <span class="badge purple" style="padding:6px 8px">Subió a las ${p.horaPiso2||'—'}</span>
          `}

          ${!p.B ? `
            <button class="btn sm blue" onclick="marcarPaso(${p.n},'B')">▶ Inició fila/atención</button>
          ` : (!p.C ? `
            <button class="btn sm pri" onclick="marcarPaso(${p.n},'C')">✔ Fin atención</button>

            <span class="badge ok">Atendido</span>

          <button class="btn sm ${p.obs==='AB'?'bad':''}" title="Abandonó la fila" onclick="setObsPersona(${p.n},'AB')">AB</button>
          <button class="btn sm ${p.obs==='PE'?'bad':''}" title="Dato perdido" onclick="setObsPersona(${p.n},'PE')">PE</button>
        </div>
      </div>`;
    });
  }
  h += `</div>`;

  // HISTORIAL DE HOY (TABLA)
  h += `
  <div class="card">
    <h2>
      <span>📋 Historial Sesión ${s.num} (${s.people.length})</span>
    </h2>
    <div class="tbl">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Tipo</th>
            <th>Puerta</th>
            <th>Piso</th>
            <th>Llegada</th>
            <th>Subió P2</th>
            <th>Salida</th>
            <th>Estancia</th>
            <th>Obs</th>
          </tr>
        </thead>
        <tbody>
          ${s.people.slice().reverse().map(p => {
            const estancia = toS(p.A)!=null && toS(p.D)!=null ? dur(toS(p.D)-toS(p.A)) : (p.previo ? 'Previo' : '—');
            const esT = (p.puerta === 'Trasera');
            const esFunc = (p.tipo === 'Funcionario');
            const enP2 = (p.piso === 'Piso 2');
            return `
            <tr>
              <td><b>#${p.n}</b> ${esc(p.nombre||'')}</td>
              <td><span class="badge ${esFunc ? 'purple' : 'ok'}">${p.tipo||'Estudiante'}</span></td>
              <td><span class="badge ${esT ? 'blue' : 'ok'}">${p.puerta||'Delantera'}</span></td>

            </tr>`;
          }).join('')}

      </table>
    </div>
  </div>`;

  return h;
}

/* ================== VISTA: MÉTRICAS Y DATOS PARA UNITY ================== */
function vResumen(){
  const s = cur();
  const k = calcSession(s);
  const ks = S.sessions.map(calcSession);
  const m = f => r2(avg(ks.map(f).filter(x=>x!=null&&!isNaN(x))));
  const mm = f => {
    const v = avg(ks.map(f).filter(x=>x!=null&&!isNaN(x)));
    return v==null ? '—' : r2(v/60)+' min ('+Math.round(v)+' s)';
  };

  const consolidados = [
    ['Personas promedio por sesión (total)', m(x=>x.total)],
    ['Llegadas por Puerta Delantera (promedio)', m(x=>x.del)],
    ['Llegadas por Puerta Trasera (promedio)', m(x=>x.tras)],
    ['% Estudiantes (agentes con trámite/cola)', m(x=>x.total) ? Math.round((m(x=>x.est)/m(x=>x.total))*100)+'%' : '—'],
    ['% Funcionarios/Docentes (permanencia laboral)', m(x=>x.total) ? Math.round((m(x=>x.func)/m(x=>x.total))*100)+'%' : '—'],
    ['% Agentes hacia Piso 1 (Extensión / Cs. Aplicadas)', m(x=>x.total) ? Math.round((m(x=>x.piso1)/m(x=>x.total))*100)+'%' : '—'],
    ['% Agentes hacia Piso 2 (Escaleras → ORI / Grad / Doc)', m(x=>x.total) ? Math.round((m(x=>x.piso2)/m(x=>x.total))*100)+'%' : '—'],
    ['Frecuencia total de llegada λ (pers/min)', m(x=>x.lambda)],
    ['Frecuencia Spawner Delantera (pers/min)', m(x=>x.lambdaDel)],
    ['Frecuencia Spawner Trasera (pers/min)', m(x=>x.lambdaTras)],
    ['Tiempo de tránsito a escaleras (s)', m(x=>x.wEscalera)+' s'],
    ['Tiempo promedio de recorrido en Piso 1', mm(x=>x.wPiso1)],
    ['Tiempo promedio de recorrido en Piso 2', mm(x=>x.wPiso2)],
    ['Tiempo promedio general en el bloque (D−A)', mm(x=>x.w)],
    ['Tiempo promedio de espera en cola (B−A)', mm(x=>x.wq)],
    ['Capacidad del espacio (espera / aforo)', (S.cfg.capEspera||'—')+' / '+(S.cfg.aforo||'—')],
    ['Cola promedio observada', m(x=>x.colaProm)]
  ];

  return `
  <div class="card">
    <h2>🧩 Parámetros Validados para Unity (${S.sessions.length} sesiones)</h2>
    <p class="muted">Datos listos para configurar tus Spawners, NavMesh y árbol de decisiones de agentes en Unity:</p>
    <table>
      <thead>
        <tr>
          <th style="text-align:left">Parámetro del Modelo</th>
          <th>Dato Observado Real</th>
          <th>Valor en Unity</th>
        </tr>
      </thead>
      <tbody>
        ${consolidados.map(r => `
          <tr>
            <td style="text-align:left"><b>${r[0]}</b></td>
            <td><span class="badge ok">${r[1]}</span></td>
            <td><input value="${esc(S.cfg.unity[r[0]]||'')}" placeholder="Ej: ${r[1]}" onchange="S.cfg.unity['${r[0]}']=this.value;save()"></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  </div>

  <div class="card">
    <h2>📊 Resumen Sesión Actual (#${s.num})</h2>
    <table>
      <tr><td style="text-align:left">Estado</td><td><b>${s.fin ? 'Cerrada ('+s.inicio+' a '+s.fin+')' : (s.inicio ? 'En curso (desde '+s.inicio+')' : 'Sin iniciar')}</b></td></tr>
      <tr><td style="text-align:left">Total de llegadas</td><td><b>${k.total}</b> (Del: ${k.del} · Tras: ${k.tras})</td></tr>
      <tr><td style="text-align:left">Estudiantes vs Funcionarios</td><td><b>${k.est}</b> Estudiantes · <b>${k.func}</b> Funcionarios</td></tr>
      <tr><td style="text-align:left">Distribución por Piso</td><td>Piso 1: <b>${k.piso1}</b> · Subieron a Piso 2: <b>${k.piso2} (${k.pctPiso2}%)</b></td></tr>
      <tr><td style="text-align:left">Total salidas completas</td><td><b>${k.comp}</b></td></tr>
      <tr><td style="text-align:left">Personas aún adentro</td><td><b>${k.adentro}</b></td></tr>
      <tr><td style="text-align:left">Tiempo prom. de recorrido (D−A)</td><td><b>${dur(k.w)}</b></td></tr>
      <tr><td style="text-align:left">Cortes de 10 min realizados</td><td><b>${k.cortes} / 6</b></td></tr>
    </table>
  </div>`;
}

/* ================== EXPORTACIÓN EXCEL OFICIAL CON TODAS LAS HOJAS ================== */
function fname(ext, sessNum = null){
  const c = S.cfg;
  const cl = x => String(x||'').replace(/[^\w]+/g,'');
  const z = cl(c.zona) || 'Zona1';
  const b = cl(c.bloque) || 'BloqueAdminA';
  const p = cl(c.est1) + (c.est2 ? '-' + cl(c.est2) : '');
  const sStr = sessNum ? `_Sesion${sessNum}` : '';
  return `${z}_${b}_${p || 'Pareja'}${sStr}.${ext}`;
}

function allPeople(targetSessionId = null){
  const list = targetSessionId ? S.sessions.filter(s => s.id === targetSessionId) : S.sessions;
  return list.flatMap(s => s.people.map(p => ({...p, s})));
}

function rowsLlegadas(targetSessionId = null){
  return allPeople(targetSessionId).map(p => {
    const d = (a,b) => toS(p[a])!=null && toS(p[b])!=null ? toS(p[b])-toS(p[a]) : '';
    return {
      'Sesión': p.s.num,
      'Fecha': p.s.fecha,
      'Día': p.s.dia,
      'Bloque': S.cfg.bloque,
      'N°': p.n,
      'A. Llegada': p.A || (p.previo ? 'Ya estaba en bloque' : ''),
      'B. Inicio atención': p.B,
      'C. Fin atención': p.C,
      'D. Salida': p.D,
      'Serv.': p.serv || '1',
      'Obs.': p.obs || '',
      'Tipo Persona': p.tipo || 'Estudiante',
      'Puerta Entrada': p.puerta || 'Delantera',
      'Piso / Destino': p.piso || 'Piso 1',
      'Hora Subió Piso 2': p.horaPiso2 || '',
      'Tiempo Recorrido D-A (s)': d('A','D'),
      'Tiempo hasta Escaleras (s)': d('A','horaPiso2'),
      'Espera en cola B-A (s)': d('A','B'),
      'Atención C-B (s)': d('B','C')
    };
  });
}

function generarWorkbook(targetSessionId = null){
  const wb = XLSX.utils.book_new(), c = S.cfg;
  const sesionesExportar = targetSessionId ? S.sessions.filter(s => s.id === targetSessionId) : S.sessions;

  // HOJA 1: IDENTIFICACIÓN Y PARÁMETROS DEL BLOQUE (FORMATO 1)
  const f1 = [
    ['UNIVERSIDAD DE LA GUAJIRA - SIMULACIÓN - RECOLECCIÓN DE DATOS'],
    ['HOJA 2: IDENTIFICACIÓN Y PARÁMETROS DEL BLOQUE'],
    [],
    ['Zona', c.zona || 'Zona 1'],
    ['Bloque', c.bloque || 'Bloque Administrativo A'],
    ['Estudiante 1 (Columna A)', c.est1 || 'Balmes'],
    ['Estudiante 2 (Columnas B, C, D + F3)', c.est2 || ''],
    ['Punto exacto observado', c.punto || 'Puerta delantera y trasera · 2 Pisos'],
    ['Horario del punto', c.horario || 'Hora pico'],
    [],
    ['FORMATO 1: PARÁMETROS ESTRUCTURALES', 'VALOR', 'CÓMO SE OBTIENE'],
    ['Número de servidores (c)', c.c || '1', 'Puntos de atención simultáneos'],
    ['¿Los servidores son iguales?', c.iguales || 'Sí', 'Sí / No. Si no, en qué se diferencian'],
    ['Accesos que tiene el bloque', c.accesos || '2 accesos (Delantera y Trasera)', 'Cuántos; cuál observa usted'],
    ['Disciplina de la cola', c.disciplina || 'FIFO', 'FIFO / prioridad / sin orden'],
    ['¿Una sola fila o una por servidor?', c.fila || 'Una sola fila', 'Observar, no suponer'],
    ['Capacidad de la zona de espera', c.capEspera || '25', 'Personas que caben antes de que la fila salga'],
    ['Turnos del personal', c.turnos || 'Jornada continua', 'Preguntar si aplica'],
    ['¿Se va gente al ver la fila?', c.abandono || 'No', 'Sí / No. Si sí, cuántas por hora'],
    ['Aforo publicado del bloque', c.aforo || '60', 'Letrero de evacuación, si existe'],
    [],
    ['Piso 1 (Dependencias)', 'Vicerrectoría de Extensión y Facultad de Ciencias Aplicadas'],
    ['Piso 2 (Dependencias)', 'ORI, Centro de Graduados y Vicerrectoría de Docencia (Acceso por escaleras)']
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(f1), 'Hoja 2 - Formato 1');

  // HOJA 2: REGISTRO DE LLEGADAS Y ATENCIÓN (HOJA 3)
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rowsLlegadas(targetSessionId)), 'Hoja 3 - Registro');

  // HOJA 3: CONTEO CADA 10 MINUTOS (FORMATO 3)
  const rCortes = sesionesExportar.flatMap(s => s.cortes.map(k => ({
    'Sesión': s.num,
    'Fecha': s.fecha,
    'Corte N°': k.n,
    'Hora exacta': k.hora,
    'Llegadas en los 10 min': +k.llegadas,
    'Personas en cola': +k.cola,
    'Servidores ocupados': +k.ocup,
    'Servidores libres': Math.max(0, (+c.c||1) - (+k.ocup||0))
  })));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rCortes), 'Hoja 4 - F3 Cortes');

  // HOJA 4: RESUMEN DE LA SESIÓN (FORMATO 4)
  const res = [
    ['FORMATO 4: Resumen de la sesión', ...sesionesExportar.map(s => 'Sesión ' + s.num + (s.titulo ? ' (' + s.titulo + ')' : ''))],
    ['Notas / Título de la sesión', ...sesionesExportar.map(s => s.titulo || s.notas || '—')],
    ['Fecha y día', ...sesionesExportar.map(s => s.fecha + ' (' + s.dia + ')')],
    ['Hora inicio (START)', ...sesionesExportar.map(s => s.inicio || '—')],
    ['Hora fin (CIERRE)', ...sesionesExportar.map(s => s.fin || '—')],
    ['Duración real de la sesión (minutos)', ...sesionesExportar.map(s => s.inicio && s.fin ? r2((toS(s.fin)-toS(s.inicio))/60) : '—')],
    ['Total de llegadas registradas', ...sesionesExportar.map(s => s.people.length)],
    ['Total de atenciones completas (B, C y D)', ...sesionesExportar.map(s => calcSession(s).comp)],
    ['Observaciones perdidas (PE)', ...sesionesExportar.map(s => calcSession(s).pe)],
    ['Abandonos (AB)', ...sesionesExportar.map(s => calcSession(s).ab)],
    ['Con prioridad (PR)', ...sesionesExportar.map(s => calcSession(s).pr)],
    ['Clima y condiciones del día', ...sesionesExportar.map(s => s.clima || 'Normal / Despejado')],
    ['Algo anormal que explique datos raros', ...sesionesExportar.map(s => s.anormal || 'Ninguna')]
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(res), 'Hoja 4 - F4 Resumen');

  // HOJA 5: CONSOLIDACIÓN DE DATOS PARA UNITY (PREENTREGA SEMANA 14)
  const ks = sesionesExportar.map(calcSession);
  const m = f => r2(avg(ks.map(f).filter(x=>x!=null&&!isNaN(x))));
  const tUnity = [
    ['Variable para Unity', 'Datos Observados', 'Valor utilizado en Unity'],
    ['Personas promedio (Total)', m(x=>x.total), c.unity['Personas promedio por sesión (total)']||m(x=>x.total)],
    ['Tiempo promedio de recorrido', r2(m(x=>x.w)/60)+' min ('+Math.round(m(x=>x.w)||0)+'s)', c.unity['Tiempo promedio de recorrido en bloque (D−A)']||r2(m(x=>x.w)/60)+' min'],
    ['Tiempo promedio de espera', r2(m(x=>x.wq)/60)+' min ('+Math.round(m(x=>x.wq)||0)+'s)', c.unity['Tiempo promedio de espera en cola (B−A)']||'0 min'],
    ['Capacidad del espacio', (c.capEspera||'25') + ' / ' + (c.aforo||'60'), c.capEspera||'25'],
    ['Frecuencia total de llegada λ', m(x=>x.lambda)+' pers/min', c.unity['Frecuencia total de llegada λ (pers/min)']||m(x=>x.lambda)],
    ['% Estudiantes (Trámite / Cola)', m(x=>x.total) ? Math.round((m(x=>x.est)/m(x=>x.total))*100)+'%' : '—', ''],
    ['% Funcionarios (Laboral)', m(x=>x.total) ? Math.round((m(x=>x.func)/m(x=>x.total))*100)+'%' : '—', ''],
    ['% Probabilidad Destino Piso 1', m(x=>x.total) ? Math.round((m(x=>x.piso1)/m(x=>x.total))*100)+'%' : '—', ''],
    ['% Probabilidad Destino Piso 2 (Escaleras)', m(x=>x.total) ? Math.round((m(x=>x.piso2)/m(x=>x.total))*100)+'%' : '—', ''],
    ['Tasa Spawner Delantera (pers/min)', m(x=>x.lambdaDel), c.unity['Frecuencia Spawner Delantera (pers/min)']||m(x=>x.lambdaDel)],
    ['Tasa Spawner Trasera (pers/min)', m(x=>x.lambdaTras), c.unity['Frecuencia Spawner Trasera (pers/min)']||m(x=>x.lambdaTras)],
    ['Tiempo promedio recorrido Piso 1', r2(m(x=>x.wPiso1)/60)+' min', ''],
    ['Tiempo promedio recorrido Piso 2', r2(m(x=>x.wPiso2)/60)+' min', '']
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(tUnity), 'Consolidación Unity');

  return wb;
}

function exportXLSX(targetSessionId = null){
  if(!window.XLSX){ toast('Sin librería Excel. Use CSV.'); return; }
  const wb = generarWorkbook(targetSessionId);
  const sessObj = targetSessionId ? S.sessions.find(s => s.id === targetSessionId) : null;
  XLSX.writeFile(wb, fname('xlsx', sessObj ? sessObj.num : null));
}

async function compartirArchivo(tipo = 'xlsx', targetSessionId = null){
  const ext = tipo === 'xlsx' ? 'xlsx' : 'json';
  const sessObj = targetSessionId ? S.sessions.find(s=>s.id===targetSessionId) : null;
  const filename = fname(ext, sessObj ? sessObj.num : null);

  let blob;
  if(tipo === 'xlsx'){
    if(!window.XLSX){ toast('Sin librería Excel'); return; }
    const wb = generarWorkbook(targetSessionId);
    const u8 = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    blob = new Blob([u8], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  } else {
    const data = targetSessionId ? { cfg: S.cfg, session: sessObj } : S;
    blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  }

  const file = new File([blob], filename, { type: blob.type });

  if(navigator.canShare && navigator.canShare({ files: [file] })){
    try {
      await navigator.share({
        title: 'Toma de Datos Uniguajira',
        text: `Datos de ${S.cfg.bloque} (${filename})`,
        files: [file]
      });
      toast('Compartido exitosamente');
      return;
    } catch(err) {
      if(err.name === 'AbortError') return;
    }
  }

  // Fallback a descarga normal en caso de no soportar compartir
  dl(filename, blob, blob.type);
  toast('Archivo descargado en tu dispositivo');
}

function dl(name, data, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type}));
  a.download = name;
  a.click();
}
function exportCSV(){
  const r = rowsLlegadas();
  if(!r.length) return toast('Sin datos');
  const h = Object.keys(r[0]);
  dl(fname('csv'), '\ufeff' + [h.join(';'), ...r.map(x=>h.map(k=>`"${String(x[k]).replace(/"/g,'""')}"`).join(';'))].join('\n'), 'text/csv');
}
function exportJSON(targetSessionId = null){
  if(targetSessionId){
    const s = S.sessions.find(x => x.id === targetSessionId);
    if(!s) return;
    dl(fname('json', s.num), JSON.stringify({ cfg: S.cfg, session: s }, null, 1), 'application/json');
  } else {
    dl(fname('json'), JSON.stringify(S, null, 1), 'application/json');
  }
}
function importJSON(f){
  if(!f) return;
  f.text().then(t => {
    try {
      const d = JSON.parse(t);
      if(!d.cfg && !d.session && !d.sessions) throw 0;
      if(confirm('¿Cargar datos del archivo JSON?')){
        if(d.session){
          const existe = S.sessions.findIndex(x => x.id === d.session.id);
          if(existe >= 0) S.sessions[existe] = d.session;
          else S.sessions.push(d.session);
          S.cur = d.session.id;
        } else {
          S = d;
        }
        save();
        render();
        toast('Datos cargados exitosamente');
      }
    }catch(e){ alert('Archivo JSON inválido'); }
  });
}

/* ================== RENDER & RELOJ ================== */
function hdr(){
  $('#hBloque').textContent = S.cfg.bloque || 'Bloque Administrativo A';
}
function render(){
  const y = scrollY;
  $('#app').innerHTML = {
    registro: vRegistro,
    cortes: vCortes,
    resumen: vResumen,
    datos: vDatos,
    bloque: vBloque
  }[tab]();

  document.querySelectorAll('nav button').forEach(b => {
    b.classList.toggle('on', b.dataset.t === tab);
  });
  hdr();
  scrollTo(0, y);
}

document.querySelectorAll('nav button').forEach(b => {
  b.onclick = () => {
    tab = b.dataset.t;
    render();
    scrollTo(0, 0);
  };
});

setInterval(() => {
  $('#clock').textContent = nowT();
  const s = cur();
  if(!s) return;
  
  if(s.inicio && !s.fin){
    const el = $('#sessElapsed');
    if(el) el.textContent = dur(toS(nowT()) - toS(s.inicio));
  }

  if(tab === 'registro' && s.inicio && !s.fin){
    const nowSeg = toS(nowT());
    const nextCut = toS(s.inicio) + 600 * (s.cortes.length + 1);
    const left = nextCut - nowSeg;
    if(left === 0){
      beep(700, .4);
      vib([200,100,200]);
      render();
    }
  }
}, 1000);

render();

// Cargar/sincronizar con Supabase en segundo plano al iniciar
setTimeout(() => {
  descargarDesdeSupabase(false);
}, 600);
</script>
